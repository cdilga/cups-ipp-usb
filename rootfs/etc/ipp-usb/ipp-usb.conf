# ipp-usb configuration for running next to CUPS in one container.
# Full reference: man ipp-usb.8

[network]
  http-min-port = 60000
  http-max-port = 65535

  # CUPS in this container already advertises the shared queue over mDNS.
  # Advertising the raw USB device too would show a second copy of the
  # printer on the LAN.
  dns-sd = disable

  # Listen on the container's interfaces so the printer's web admin pages
  # can be reached through a published port. Only reachable from outside if
  # you publish 60000; CUPS itself talks to it over localhost.
  interface = all

  ipv6 = enable

[logging]
  device-log    = error
  main-log      = info
  console-log   = info
  max-file-size    = 256K
  max-backup-files = 2
  console-color = disable
