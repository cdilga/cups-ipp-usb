# Brother HL-L2400DW: after the kernel usblp driver (or a previous client) has
# used the device, the printer stalls SET_INTERFACE to the IPP-over-USB
# alternate setting ("libusb_set_interface_alt_setting: Other error").
# A USB reset on start clears it. Verified 2026-09-27, firmware as shipped.
[Brother HL-L2400DW]
  init-reset = hard
